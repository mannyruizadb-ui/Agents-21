# Netlify build settings for PlantBoard (static SPA + PWA).
# Env vars are set in the Netlify UI (Site configuration → Environment variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY (publishable key only — never the service role key).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Web Push VAPID PUBLIC key. Public by design (every browser receives it), so it is safe here.
  # Its private half lives only in the send-alerts function secrets. Changing it breaks every
  # saved subscription, so keep it in step with the VAPID_PUBLIC_KEY function secret.
  VITE_VAPID_PUBLIC_KEY = "BNQ7lNE6Tn1lwSdSJYZ2KxvPJycXi4rbyzIcDWX1Zb0xiMLUgObPjoU74Nbyw4uCruJZK7PfLNwwBZkkXbYPHMo"

# Single-page app: every route is served by index.html (React Router handles it).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, or clients get stuck on an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
