name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Guard hook tests (production and read-only guards)
        run: bash .claude/hooks/test-hooks.sh .
      - name: Build
        run: npm run build
        env:
          # Build-time placeholders; real values come from the hosting provider at deploy.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  edge-functions:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: send-alerts tests
        working-directory: supabase/functions/send-alerts
        run: deno test --allow-env --allow-net --allow-read
      - name: manage-users tests (password rules, validation, authz)
        working-directory: supabase/functions/manage-users
        run: deno test --allow-env --allow-net --allow-read
      - name: sign-in tests (lockout decisions)
        working-directory: supabase/functions/sign-in
        run: deno test --allow-env --allow-net --allow-read

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Postgres
        run: npx supabase db start
      - name: Apply migrations and seed from scratch
        run: npx supabase db reset --local
      - name: Run pgTAP tests (RLS guard, role matrix)
        run: npx supabase test db
